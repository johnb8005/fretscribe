[package]
name = "fretscribe"
version = "0.1.0"
description = "Realtime guitar note, scale and chord transcriber"
edition = "2021"

[lib]
name = "fretscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Linux (WebKitGTK) denies getUserMedia by default; we grant it from Rust.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
