name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests (synthetic guitar + humming audio)
        run: bun test
      - name: Typecheck + build
        run: bun run build

  release:
    name: Tag, deploy to GitHub Pages, release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver tag
        id: version
        run: |
          git fetch --tags --force
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="v$(jq -r .version package.json)"
          else
            if [ -z "$(git log "$last"..HEAD --oneline)" ]; then
              echo "No commits since $last, nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            msgs=$(git log "$last"..HEAD --format=%B)
            # Conventional commits: "type!:" / BREAKING CHANGE → major, feat → minor, else patch.
            if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<< "$msgs"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$msgs"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="v$major.$minor.$patch"
          fi
          echo "Releasing $next (previous: ${last:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.skip != 'true'
        with:
          bun-version: latest

      - name: Build for Pages
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          bun install --frozen-lockfile
          bun run build
          (cd dist && zip -qr "../fretscribe-web-$VERSION.zip" .)

      - uses: actions/configure-pages@v5
        if: steps.version.outputs.skip != 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.version.outputs.skip != 'true'
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.version.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: Create tag + GitHub release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fretscribe ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **Open the app:** ${{ steps.deploy.outputs.page_url }}

            The attached zip is the static site, if you want to host it yourself.
          files: fretscribe-web-${{ steps.version.outputs.version }}.zip
