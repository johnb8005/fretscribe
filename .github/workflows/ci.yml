name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & build check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (synthetic guitar audio)
        run: bun test

      - name: Typecheck + frontend build
        run: bun run build

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust shell
        working-directory: src-tauri
        run: cargo check --locked

  release:
    name: Tag & Linux release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver tag
        id: version
        run: |
          git fetch --tags --force
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="v$(jq -r .version package.json)"
          else
            if [ -z "$(git log "$last"..HEAD --oneline)" ]; then
              echo "No commits since $last, nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            msgs=$(git log "$last"..HEAD --format=%B)
            # Conventional commits: "type!:" / BREAKING CHANGE → major, feat → minor, else patch.
            if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<< "$msgs"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$msgs"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="v$major.$minor.$patch"
          fi
          echo "Releasing $next (previous: ${last:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into manifests
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.skip != 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
          bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip != 'true'
        with:
          workspaces: src-tauri

      - name: Build Linux bundles (.deb, .rpm, .AppImage)
        if: steps.version.outputs.skip != 'true'
        run: bun tauri build --bundles deb,rpm,appimage

      - name: Collect artifacts
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          b=src-tauri/target/release/bundle
          cp $b/deb/*.deb $b/rpm/*.rpm $b/appimage/*.AppImage out/
          cp src-tauri/target/release/fretscribe "out/fretscribe-$VERSION-linux-x86_64"
          chmod +x out/*.AppImage "out/fretscribe-$VERSION-linux-x86_64"
          (cd out && sha256sum * > SHA256SUMS)
          ls -lh out

      - name: Create tag + GitHub release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fretscribe ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*
